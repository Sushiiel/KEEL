[project]
name = "keel"
version = "0.3.0"
description = "The runtime trust layer for agentic AI — verify every AI agent action before it executes, and sign tamper-proof proof for auditors and insurers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "KEEL" }]
keywords = ["ai", "agents", "agentic", "trust", "safety", "guardrails",
            "governance", "llm", "mcp", "audit", "compliance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy", "scipy", "networkx", "fastapi", "uvicorn[standard]",
  "pydantic>=2", "cryptography",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "hypothesis"]
llm = ["litellm", "anthropic"]
mcp = ["mcp"]
otel = ["opentelemetry-api", "opentelemetry-sdk", "opentelemetry-exporter-otlp-proto-http"]
vectors = ["qdrant-client"]
all = ["litellm", "anthropic", "mcp", "opentelemetry-api", "opentelemetry-sdk",
       "opentelemetry-exporter-otlp-proto-http", "qdrant-client", "jsonschema"]

[project.scripts]
keel = "keel.cli:main"

[project.urls]
Documentation = "https://keel.best/docs"
Source = "https://github.com/Sushiiel/KEEL"
Homepage = "https://keel.best"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["keel*"]

[tool.setuptools.package-data]
keel = ["ui/*", "site/*", "schemas/*", "gate/policy/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
